<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometrie del Cuore · La Dimora delle Melodie</title><style>
:root{--gold:#dfbf7d;--night:#140c0d}*{box-sizing:border-box}html,body{margin:0;background:var(--night);color:#f9eddf;font-family:Georgia,'Times New Roman',serif}button{cursor:pointer;font:inherit;color:inherit}button:focus-visible,.frame:focus-visible{outline:3px solid #ffde8b;outline-offset:3px}.view{height:100dvh;min-height:530px;position:relative;overflow:hidden;background:#160d10}.scene{position:absolute;inset:0;background-image:linear-gradient(to bottom,rgba(0,0,0,.2),transparent 40%,rgba(5,0,0,.36)),url('salotto_scenografico.png');background-position:center;background-size:cover;transition:transform .25s}.view.theater .scene{background-image:linear-gradient(to bottom,rgba(0,0,0,.18),transparent 55%,rgba(5,0,0,.5)),url('teatro.png')}.shade{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 100px #09050588}.top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:15}.topRight{display:flex;gap:8px}.round{border:1px solid #daba75aa;background:#1d1013c9;border-radius:999px;padding:10px 12px;min-width:41px;backdrop-filter:blur(6px)}.round:hover,.action:hover{background:#58382c}.invisible{display:none!important}.bottom{position:absolute;bottom:0;left:0;right:0;z-index:10;padding:12px max(12px,calc((100vw - 1100px)/2));background:linear-gradient(transparent,#150c12eb 17%,#150c12f7);display:flex;align-items:end;gap:18px;justify-content:space-between}.recordbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;max-width:465px}.album{width:110px;min-height:112px;padding:12px 7px 6px;border:1px solid #e1b876;background:linear-gradient(135deg,#775245,#24121c 70%);display:flex;flex-direction:column;justify-content:space-between;align-items:center;box-shadow:2px 4px 11px #000c;text-align:center;font-size:12px;cursor:grab;touch-action:manipulation}.album:nth-child(2){background:linear-gradient(145deg,#d7cbb9,#517484 55%,#101f32)}.album .vinyl{width:47px;height:47px;background:repeating-radial-gradient(circle,#131313 0 2px,#35302a 3px 4px);border-radius:50%;display:grid;place-items:center}.album .vinyl:after{content:'';background:#ae7951;width:14px;height:14px;border-radius:50%}.turntable{border:1px solid #e2bb7d85;border-radius:15px;padding:11px;background:linear-gradient(145deg,#4a291b,#120b09);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:116px}.platter{width:81px;height:81px;border-radius:50%;border:4px solid #765d4a;background:repeating-radial-gradient(circle,#070707 0 4px,#222 5px 6px);position:relative}.platter:after{content:'';position:absolute;top:35%;left:35%;width:30%;height:30%;background:#bd8b61;border-radius:50%}.spinning{animation:spin 2.3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.discText{text-align:center;font-size:11px;color:#e9c98f}.smallButtons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.action{padding:9px 12px;border:1px solid #b99462;border-radius:12px;background:#200e14da;font-size:13px}.photoGallery{position:absolute;top:12%;left:2%;right:2%;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;pointer-events:none}.frame{pointer-events:auto;height:clamp(72px,14vh,130px);max-width:115px;width:100%;border:6px ridge #bd9456;background:#1a1015;box-shadow:0 5px 14px #000d;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden}.frame:nth-child(2n){transform:translateY(10px)}.frame img{width:100%;height:100%;object-fit:cover}.frame span{font-size:11px;opacity:.9;text-align:center;padding:3px}.frame:after{content:'▶';position:absolute;bottom:3px;right:5px;font-size:14px;text-shadow:0 0 5px #000}.frame.missing{background:linear-gradient(120deg,#32211b,#785340,#291821)}.paper{position:absolute;right:20px;top:43%;z-index:9;background:#dbc99e;color:#4d3020;transform:rotate(5deg);padding:18px 10px;border-radius:3px;box-shadow:2px 4px 9px #0008;border:0;font-size:19px}.theaterScreen{position:absolute;top:15%;left:50%;transform:translateX(-50%);width:min(62vw,850px);height:54%;z-index:6;background:#080506cc;border:7px ridge #ae8451;box-shadow:0 0 35px #000;display:flex;align-items:center;justify-content:center}.theaterScreen video{width:100%;height:100%;object-fit:contain;background:#090809}.hint{font-size:14px;color:#e3c9a5;text-align:center;padding:15px}.modal{position:fixed;inset:0;background:#050407db;z-index:99;display:flex;align-items:center;justify-content:center;padding:15px}.panel{position:relative;width:min(700px,95vw);max-height:88dvh;overflow-y:auto;border:3px double #a67e40;border-radius:12px;background:linear-gradient(125deg,#f3dfb7,#dbc18d);color:#442920;padding:30px 24px;box-shadow:0 0 45px #000;font-size:17px;line-height:1.55}.panel.dark{width:min(950px,97vw);background:#110b0e;color:#f7e7d2}.panel h2{margin-top:0}.close{position:absolute;top:8px;right:10px;border:0;background:#5b3329;color:white;border-radius:30px;width:34px;height:34px}.panel video{width:100%;max-height:65dvh}.modal .info{font-size:14px;color:#6a4733}.copyright{position:absolute;bottom:5px;right:15px;z-index:17;font-size:10px;color:#e5cfa7c7}.mini{font-size:11px;opacity:.85}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:720px){.photoGallery{grid-template-columns:repeat(5,1fr);top:10%;gap:4px}.frame{border-width:3px;height:62px}.bottom{gap:8px;align-items:center;flex-direction:column;padding:20px 8px 10px}.album{width:85px;min-height:82px;font-size:10px}.album .vinyl{width:30px;height:30px}.recordbox{justify-content:center}.turntable{min-width:100px;padding:6px}.platter{width:60px;height:60px}.paper{top:41%;right:8px;padding:10px}.theaterScreen{top:25%;width:89vw;height:34%}.copyright{display:none}}@media(prefers-reduced-motion:reduce){.spinning{animation-duration:0s}}
</style></head><body><main class="view" id="view"><div class="scene" id="scene"></div><div class="shade"></div><nav class="top"><button id="home" class="round" title="Torna al salotto" aria-label="Torna al salotto">⌂</button><div class="topRight"><button class="round" id="instructions" title="Istruzioni">?</button><button class="round" id="privacy" title="Privacy e licenza">©</button><button class="round" id="theaterBtn" title="Entra nel teatro">♫</button></div></nav><section id="gallery" class="photoGallery" aria-label="Galleria di dieci ricordi"></section><button id="paper" class="paper" title="Apri la pergamena delle istruzioni" aria-label="Apri istruzioni">✉</button><section id="screen" class="theaterScreen invisible"><div class="hint">Scegli un vinile nel salotto e premi ▶ per vedere il video nel teatro.</div></section><section class="bottom" id="controls"><div class="recordbox"><button class="album" draggable="true" data-song="0"><span>Ti cercavo senza saperlo</span><i class="vinyl"></i></button><button class="album" draggable="true" data-song="1"><span>Sole d’inverno</span><i class="vinyl"></i></button></div><button class="turntable" id="turntable" aria-label="Posa il vinile sul giradischi"><span class="platter" id="platter"></span><span class="discText" id="current">Trascina qui un vinile</span></button><div class="smallButtons"><button class="action" id="play">▶ Ascolta</button><button class="action" id="pause">Ⅱ Pausa</button><button class="action" id="watch">▣ Guarda il video</button></div></section><div class="copyright">© Geometrie del Cuore · Tutti i diritti riservati</div><audio id="audio" preload="none"></audio></main><div id="modalMount"></div><script>
'use strict';
const songs=[{name:'Ti cercavo senza saperlo',audio:'Ti_cercavo_senza_saperlo.mp3',video:'video1.mp4'},{name:'Sole d’inverno',audio:'Sole_d_inverno.mp3',video:null}];
const $=id=>document.getElementById(id),view=$('view'),audio=$('audio');let current=-1,mode='home';
function message(title,body,dark=false){closeModal();const modal=document.createElement('div');modal.className='modal';modal.innerHTML='<section class="panel '+(dark?'dark':'')+'" role="dialog" aria-modal="true"><button class="close" aria-label="Chiudi">×</button><h2></h2><div class="content"></div></section>';modal.querySelector('h2').textContent=title;modal.querySelector('.content').append(body);modal.querySelector('.close').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});$('modalMount').append(modal);}
function closeModal(){const m=$('modalMount');m.querySelectorAll('video').forEach(v=>v.pause());m.replaceChildren()}
function p(text){const el=document.createElement('p');el.textContent=text;return el}
function choose(i){current=i;audio.pause();audio.src=songs[i].audio;audio.load();$('current').textContent=songs[i].name;$('platter').classList.remove('spinning');$('watch').disabled=!songs[i].video;$('watch').title=songs[i].video?'Guarda il video':'Video non ancora previsto';}
function play(){if(current<0)choose(0);audio.play().then(()=>$('platter').classList.add('spinning')).catch(()=>{message('Riproduzione non avviata',p('Aggiungi il file '+songs[current].audio+' nella stessa cartella di index.html e riprova.'))})}
function pause(){audio.pause();$('platter').classList.remove('spinning');$('screen').querySelector('video')?.pause()}
function theater(){mode='theater';view.classList.add('theater');$('gallery').classList.add('invisible');$('paper').classList.add('invisible');$('screen').classList.remove('invisible');$('home').title='Torna al salotto';}
function goHome(){mode='home';view.classList.remove('theater');$('gallery').classList.remove('invisible');$('paper').classList.remove('invisible');$('screen').classList.add('invisible');$('screen').replaceChildren();}
function watch(){if(current<0)choose(0);const song=songs[current];if(!song.video){message('Prossimamente',p('Per questa canzone non è ancora stato associato un video.'));return}theater();audio.pause();$('platter').classList.remove('spinning');const v=document.createElement('video');v.src=song.video;v.controls=true;v.autoplay=true;v.playsInline=true;v.setAttribute('aria-label','Video: '+song.name);$('screen').replaceChildren(v);v.play().catch(()=>{});}
function memory(i){pause();const body=document.createElement('div'),v=document.createElement('video');v.src='foto'+i+'.mp4';v.controls=true;v.autoplay=true;v.playsInline=true;v.onerror=()=>{const note=p('Il filmato foto'+i+'.mp4 non è ancora presente nella cartella del sito.');body.append(note)};body.append(v);message('Ricordo '+i,body,true);v.play().catch(()=>{});}
for(let i=1;i<=10;i++){const b=document.createElement('button');b.className='frame missing';b.title='Apri ricordo '+i;b.setAttribute('aria-label','Apri ricordo '+i);const img=new Image();img.src='foto'+i+'.png';img.alt='Anteprima ricordo '+i;img.onload=()=>{b.classList.remove('missing');b.replaceChildren(img)};b.append('Ricordo '+i);b.onclick=()=>memory(i);$('gallery').append(b)}
for(const b of document.querySelectorAll('.album')){b.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',b.dataset.song));b.onclick=()=>choose(Number(b.dataset.song))}
$('turntable').addEventListener('dragover',e=>e.preventDefault());$('turntable').addEventListener('drop',e=>{e.preventDefault();const i=Number(e.dataTransfer.getData('text/plain'));if(i===0||i===1){choose(i);play()}});$('turntable').onclick=play;$('play').onclick=play;$('pause').onclick=pause;$('watch').onclick=watch;$('theaterBtn').onclick=()=>{theater();if(current===0)watch()};$('home').onclick=()=>{pause();goHome()};$('instructions').onclick=$('paper').onclick=()=>{const b=document.createElement('div');b.append(p('Scegli una canzone, trascina il suo vinile sul giradischi per ascoltarla. Su smartphone puoi toccare la copertina e poi il pulsante Ascolta.'),p('Clicca sulle fotografie incorniciate per esplorare i ricordi. Seleziona «Guarda il video» per entrare nel teatro. L’icona ⌂ ti riporta al salotto.'));message('Una pergamena per te',b)};
$('privacy').onclick=()=>{const b=document.createElement('div');b.append(p('© Geometrie del Cuore. Tutti i diritti riservati. I contenuti musicali, video, grafici e testuali sono destinati alla fruizione personale, didattica e non commerciale. Non è autorizzata la riproduzione, modifica, distribuzione o il riutilizzo senza consenso del titolare dei diritti.'),p('Privacy: questa versione del sito non prevede registrazione, moduli né sistemi di tracciamento sviluppati dall’autrice. Audio e video sono riprodotti da file locali ospitati sul sito; il gestore dell’hosting può trattare dati tecnici di accesso secondo la propria informativa.'),p('Prima della pubblicazione, integrare la titolarità dei diritti, un recapito di contatto e i dettagli effettivi dell’hosting o degli eventuali servizi esterni.'));message('Licenza e privacy',b)};
audio.onended=()=> $('platter').classList.remove('spinning');$('watch').disabled=true;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script></body></html>
